<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/tailwind.css">
    <link rel="shortcut icon" type="x-icon" href="images/logo.png">
    <script defer src="script.js"></script>
    <!-- Necessary for Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- Preload Images -->
    <link rel="preload" href="images/landing/01.png" as="image">
    <link rel="preload" href="images/landing/18.jpg" as="image">
    <link rel="preload" href="images/landing/19.jpg" as="image">
    <link rel="preload" href="images/landing/24.jpg" as="image">
  </head>
  <body>
    <!-- Website Header -->
    <header>
      <div class="logo">
          <a href="/index.html"><img class="viking-logo" src="../images/logo.png"><span class="logo-text">VIKINGS ROBOTICS</span></a>
      </div>
      <nav id="navbar">
        <button id="close-sidebar" onclick="closeSidebar()" aria-label="close sidebar">
          <img class="x-button" src="images/close_menu_icon.svg" alt="" width="64" height="52">
        </button>
        <ul class="navlinks">
          <li><a href="/about.html">ABOUT</a></li>
          <li><a href="/resources.html">RESOURCES</a></li>
          <li><a href="/gallery.html">GALLERY</a></li>
          <li><a href="/news.html">NEWS</a></li>
          <li><a href="/store.html">STORE</a></li>
        </ul>
      </nav>
      <button id="open-sidebar" onclick="openSidebar()" aria-label="open sidebar" aria-expanded="false" aria-controls="navbar">
        <img src="images/sidebar_menu_icon.svg" alt="" width="64" height="52">
      </button>
      <div id="overlay" onclick="closeSidebar()" aria-hidden="true"></div>
    </header>
    <main class="main">
      <section id="news-board-wrapper tw-container tw-mx-auto center-flex">
        <div class="news-title tw-bg-[#730709] tw-text-white">
          <h1 class="tw-left-5 tw-pl-12 tw-pr-12 tw-pt-12">Latest News</h1>
          <div class="button-divider tw-pl-11 tw-pr-11 tw-pt-4 tw-p-4">
            <button class="filter-buttons filter-active">All</button>
            <button class="filter-buttons">General</button>
            <button class="filter-buttons">FRC</button>
            <button class="filter-buttons">FTC</button>
            <button class="filter-buttons">SeaGlide</button>
          </div>
        </div>
        <div class="news-content tw-flex">
          <div class="focus-large">
            <img src="images/nehs_bensalem.jpg">
          </div>
          <div class="focus-small">
            <img src="images/nehs_front.jpg">
          </div>
        </div>
      </section>
    </main>
    <footer class="footer-section">
      <div class="footer-wrapper">
        <div class="footer-connect">
          <h1>CONNECT WITH US</h1>
          <div class="socials-icons">
            <a href="https://www.instagram.com/nehs.robotics/"><img src="images/Instagram_Glyph_White.png" alt="The Instagram logo." class="instagram"></a>
            <a href="https://www.tiktok.com/@nehs.vikings.10143?_t=ZT-8xTuCBoBU5X&_r=1"><img src="images/tiktok.png" alt="The TikTok logo." class="tiktok"></a>
          </div>
        </div>
        <div class="footer-find-more">
          <ul class="head">
            <li><span>FIND MORE</span></li>
          </ul>
          <div class="column-wrapper">
            <ul class="first-column">
              <li><a href="/about.html">About</a></li>
              <li><a href="/news.html">News</a></li>
            </ul>
            <ul class="second-column">
              <li><a href="/resources.html">Resources</a></li>
              <li><a href="/store.html">Store</a></li>
            </ul>
            <ul class="third-column">
              <li><a href="/gallery.html">Gallery</a></li>
            </ul>
          </div>
        </div>
        <div class="footer-logo">
          <img src="images/logo.png" alt="The Vikings Robotics logo.">
        </div>
      </div>
    </footer>
  </body>
</html>
